name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Dataset regenerates byte for byte
        run: python -m trbench gen --check
      - name: Leaderboard matches recorded outputs
        run: python -m trbench score --check
      - name: Demo runs with no key (replay mode)
        run: python -m trbench demo --mode replay
